# Let's Encrypt DNS-01 (Cloudflare) ClusterIssuer + a wildcard cert to prove
# issuance works with zero inbound connectivity (double-NAT-safe).
#   kubectl apply -f cluster-issuer.yaml
# Requires secret cloudflare-api-token in ns cert-manager (created out-of-band;
# to be sealed in Phase 4 — the real token is kept outside the repository).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-dns-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
# Wildcard for the cluster's own subdomain space. NPM still terminates public
# TLS with its own wildcard (cert id 2); this proves cert-manager end to end
# and is available for in-cluster/optional ingress TLS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-lab
  namespace: default
spec:
  secretName: wildcard-k8s-lab-tls
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  # Just the wildcard — adding the apex `k8s.lab.example.com` creates a second
  # DNS-01 challenge at the SAME _acme-challenge.k8s.lab.example.com record, and
  # the two race/overwrite each other's TXT value. One name = one clean token.
  commonName: "*.k8s.lab.example.com"
  dnsNames:
    - "*.k8s.lab.example.com"
