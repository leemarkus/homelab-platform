# Cilium LB-IPAM pool + L2 announcement for LoadBalancer Services.
# kubectl apply -f cilium-lb-pool.yaml
#
# ingress-nginx is pinned to the first address in the pool.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-v2-pool
spec:
  blocks:
    - start: 192.0.2.200
      stop: 192.0.2.220
---
# Announce LoadBalancer IPs via ARP from workers only (control planes are
# tainted and don't run ingress). eth0 is the cluster VLAN interface.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-v2-l2
spec:
  loadBalancerIPs: true
  interfaces:
    - eth0
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
