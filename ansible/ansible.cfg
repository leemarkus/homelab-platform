[defaults]
# Copy inventory/hosts.example.yml to inventory/hosts.yml (not committed).
inventory = inventory/hosts.yml
# Roles live in ansible/roles/, but Ansible searches relative to the PLAYBOOK
# directory by default — i.e. playbooks/roles/ — so without this every role
# lookup from playbooks/ fails with "the role 'x' was not found".
roles_path = roles
remote_user = root
host_key_checking = False
retry_files_enabled = False
# yaml callback was removed from community.general 12; use the built-in
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
